spring.application.name=OrderService
server.port = 8003

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://postgresdb:5432/projectdb
spring.datasource.username=postgres
spring.datasource.password=docker

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
eureka.instance.appname=order-service
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.hostname=order-service

management.info.env.enabled=true
management.endpoints.web.exposure.include=*

info.app.name = Order-Service
info.app.description = Order Service Project
info.app.author= Y Pavan Kalyan
info.app.version = 1.0
