spring.application.name=APIGateway

server.port=8000

eureka.instance.appname=api-gateway-service

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

eureka.instance.hostname=api-gateway
# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Swagger UI aggregated docs for downstream services
springdoc.swagger-ui.urls[0].name=API Gateway
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/user-openapi
springdoc.swagger-ui.urls[2].name=Product Service
springdoc.swagger-ui.urls[2].url=/product-openapi
springdoc.swagger-ui.urls[3].name=Order Service
springdoc.swagger-ui.urls[3].url=/order-openapi

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://user-service:8001
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://product-service:8002
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/product/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://order-service:8003
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/order/**

spring.cloud.gateway.server.webmvc.routes[3].id=user-openapi
spring.cloud.gateway.server.webmvc.routes[3].uri=http://user-service:8001
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/user-openapi
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webmvc.routes[4].id=product-openapi
spring.cloud.gateway.server.webmvc.routes[4].uri=http://product-service:8002
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/product-openapi
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webmvc.routes[5].id=order-openapi
spring.cloud.gateway.server.webmvc.routes[5].uri=http://order-service:8003
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/order-openapi
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/v3/api-docs


management.info.env.enabled=true
management.endpoints.web.exposure.include=*

info.app.name = API-GATEWAY
info.app.description = API-GATEWAY
info.app.author= Y Pavan Kalyan
info.app.version = 1.0